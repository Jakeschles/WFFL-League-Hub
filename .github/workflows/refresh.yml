name: Refresh league data

on:
  schedule:
    - cron: '7 * * * *'   # every hour
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull latest from Yahoo
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python3 fetch_yahoo.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet data.json; then echo "No changes"; exit 0; fi
          git config user.name "Jakeschles"
          git config user.email "Jakeschles@users.noreply.github.com"
          python3 build.py
          git add data.json index.html
          git commit -m "Refresh league data"
          git pull --rebase origin main
          git push origin HEAD:main
